<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Social Graph</title>
<style>
@font-face {
    font-family: 'Minecraftia';
    src: url('https://fontlibrary.org/assets/fonts/minecraftia/minecraftia-webfont.woff2') format('woff2'),
         url('https://fontlibrary.org/assets/fonts/minecraftia/minecraftia-webfont.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
* {
    font-family: 'Minecraftia', monospace !important;
}

html, body { margin:0; padding:0; height:100%; }
#search-container {
  position:absolute; top:10px; left:10px; z-index:10;
  background:white; padding:10px; border-radius:6px;
  width:250px;
}
#search {
  width:90%; padding:5% 5%;
}
#mutual-list {
  margin-top:5px;
  max-height:300px;
  overflow-y:auto;
  font-size:14px;
  padding-top:5px;
}
#network { width:100%; height:100%; }
.connection-item { margin-bottom:3px; }

/* Toggle switch */
.toggle {
  position: relative;
  width: 40px;
  height: 20px;
  display: inline-block;
  vertical-align: middle;
  margin-left: 8px;
}
.toggle input { display:none; }
.slider {
  position:absolute;
  cursor:pointer;
  top:0; left:0; right:0; bottom:0;
  background:#ccc;
  border-radius:999px;
  transition:0.25s;
}
.slider:before {
  content:"";
  position:absolute;
  height:16px; width:16px;
  left:2px; bottom:2px;
  background:white;
  border-radius:50%;
  transition:0.25s;
}
.toggle input:checked + .slider {
  background:#4CAF50;
}
.toggle input:checked + .slider:before {
  transform:translateX(20px);
}
.hidden {
  display: none;
}

<script>
fetch("https://raw.githubusercontent.com/xTimfie/InnitWeb/main/graph.json")
.then(r => r.json())
.then(source => {

  /* ----------------------------
     1. BUILD NODES
  ----------------------------- */
  const nodesMap = new Map();
  source.nodes.forEach(n => {
    if (n.uuid) {
      nodesMap.set(n.uuid, {
        id: n.uuid,
        label: n.username || n.uuid
      });
    }
  });

  /* ----------------------------
     2. COLLECT RAW EDGES
  ----------------------------- */
  const rawEdges = [];
  source.edges.forEach(e => {
    if (e.from_user_id && e.to_user_id) {
      rawEdges.push({
        from: e.from_user_id,
        to: e.to_user_id,
        weight: Number(e.total_mentions || 1)
      });
    }
  });

  /* ----------------------------
     3. MERGE MUTUAL EDGES
  ----------------------------- */
  const edgeMap = new Map();

  rawEdges.forEach(e => {
    const key = [e.from, e.to].sort().join("|");

    if (!edgeMap.has(key)) {
      edgeMap.set(key, {
        s: e.from < e.to ? e.from : e.to,
        t: e.from < e.to ? e.to : e.from,
        w1: 0,
        w2: 0
      });
    }

    const entry = edgeMap.get(key);
    if (e.from === entry.s) entry.w1 += e.weight;
    else entry.w2 += e.weight;
  });

  let edges = [];
  const connectedIds = new Set();

  edgeMap.forEach(e => {
    if (e.w1 + e.w2 > 0) {
      edges.push({
        s: e.s,
        t: e.t,
        w1: e.w1,
        w2: e.w2,
        w: e.w1 + e.w2,
        mutual: e.w1 > 0 && e.w2 > 0
      });
      connectedIds.add(e.s);
      connectedIds.add(e.t);
    }
  });

  /* ----------------------------
     4. REMOVE ISOLATED NODES
  ----------------------------- */
  const nodes = [...nodesMap.values()].filter(n => connectedIds.has(n.id));

  /* ----------------------------
     5. VIS.JS GRAPH
  ----------------------------- */
  const nodeDegrees = {};
  edges.forEach(e => {
    nodeDegrees[e.s] = (nodeDegrees[e.s] || 0) + 1;
    nodeDegrees[e.t] = (nodeDegrees[e.t] || 0) + 1;
  });

  const visNodes = new vis.DataSet(nodes.map(n => ({
    id: n.id,
    label: n.label,
    font: { face: 'Minecraftia', size: 14, align: 'top' },
    value: 10
  })));

  const visEdges = new vis.DataSet(edges.map(e => {
    const degreeSum = (nodeDegrees[e.s] || 1) + (nodeDegrees[e.t] || 1);
    return {
      id: `${e.s}-${e.t}`,
      from: e.s,
      to: e.t,
      width: 1,
      color: e.mutual ? 'blue' : 'gray',
      w1: e.w1,
      w2: e.w2,
      mutual: e.mutual,
      length: 150 + degreeSum * 15
    };
  }));

  const network = new vis.Network(
    document.getElementById('network'),
    { nodes: visNodes, edges: visEdges },
    {
      nodes: { shape: 'dot', scaling: { min: 5, max: 25 } },
      edges: { smooth: { type: 'continuous' } },
      physics: {
        enabled: true,
        stabilization: { iterations: 2000 },
        barnesHut: {
          gravitationalConstant: -5000,
          centralGravity: 0.1,
          springLength: 300,
          springConstant: 0.05,
          damping: 0.7,
          avoidOverlap: 1
        }
      }
    }
  );

  network.once('stabilizationIterationsDone', () =>
    network.setOptions({ physics: false })
  );

  /* ----------------------------
     6. SEARCH + UI LOGIC
  ----------------------------- */
  const searchInput = document.getElementById('search');
  const mutualListDiv = document.getElementById("mutual-list");
  const toggle = document.getElementById("toggle-mutual");
  const toggleRow = document.getElementById("toggle-row");

  const index = {};
  nodes.forEach(n => index[n.label.toLowerCase()] = n.id);

  let currentNode = null;

  function showConnections(nodeId) {
    toggleRow.classList.remove("hidden");
    mutualListDiv.classList.remove("hidden");

    const showMutual = toggle.checked;
    const connectedEdges = visEdges.get({
      filter: e =>
        (e.from === nodeId || e.to === nodeId) &&
        e.mutual === showMutual
    });

    if (!connectedEdges.length) {
      mutualListDiv.innerHTML = "<b>Connections:</b><br><i>No connections</i>";
      return;
    }

    const list = connectedEdges.map(e => {
      const other = e.from === nodeId ? e.to : e.from;
      return {
        label: visNodes.get(other).label,
        weight: e.w1 + e.w2
      };
    }).sort((a,b) => b.weight - a.weight);

    mutualListDiv.innerHTML =
      "<b>Connections:</b><br>" +
      list.map(c => `<div class="connection-item">${c.label}</div>`).join("");
  }

  searchInput.addEventListener('input', () => {
    const id = index[searchInput.value.trim().toLowerCase()];
    if (id) {
      currentNode = id;
      showConnections(id);
      network.focus(id, { scale: 2, animation: true });
    }
  });

  toggle.addEventListener('change', () => {
    if (currentNode) showConnections(currentNode);
  });

  network.on("selectNode", e => {
    currentNode = e.nodes[0];
    searchInput.value = visNodes.get(currentNode).label;
    showConnections(currentNode);
  });

  network.on("deselectNode", () => {
    currentNode = null;
    toggleRow.classList.add("hidden");
    mutualListDiv.classList.add("hidden");
  });

});
</script>


</body>
</html>
