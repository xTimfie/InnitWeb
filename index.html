<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InnitNet</title>
<link rel="icon" href="https://minecraft.wiki/images/Invicon_Cobweb.png?cb28b" type="image/png">

<style>
/* Fonts */
@font-face {
    font-family: 'Minecraftia';
    src: url('https://fontlibrary.org/assets/fonts/minecraftia/minecraftia-webfont.woff2') format('woff2'),
         url('https://fontlibrary.org/assets/fonts/minecraftia/minecraftia-webfont.woff') format('woff');
    font-weight: normal;
    font-style: normal;
}
* { font-family: 'Minecraftia', monospace !important; }

/* Reset body/html */
html, body { margin:0; padding:0; height:100%; background:#1E1E1E; color:white; }

/* Loading overlay */
#loading-overlay {
    position: fixed; width:80%; height:100%;  left: 20.6%; bottom: 31px;
    background: #1E1E1E; display: flex; justify-content: center; align-items: center;
    z-index: 9999; font-family: monospace;
}
#loading-text {
    color: white; font-size: 32px; font-weight: bold; text-align: center;
}


/* Left panel */
#left-panel {
    position:absolute; z-index:10;
    background:#1E1E1E;
    width:20%; height:99%;
    border-right: 1px solid #555; 
    border-bottom: 1px solid #555;
}

/* Top buttons container */
#top-buttons {
    display: flex;
    justify-content: space-around;
    margin: 10px 0 20px 0;
    padding: 0 5px;
}

.top-btn {
    width: 45px;
    height: 45px;
    background-color: #333;
    color: #FFF;
    border: 1px solid #555;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

.top-btn:hover {
    background-color: #555;
    transform: scale(1.05);
}

/* Search box */
#search {
    width: 90%;
    height: 32px;
    background: #333333;
    color: #FFFFFF;
    font-size: 16px;
    margin-top: 1%;
    margin-left:4%;
    border: 1px solid #555;
    border-radius: 4px;
}
#search:focus {
    background: #333333;
    color: #FFFFFF;
    outline: none;
    border-color: #777;
    box-shadow: 0 0 5px #555 inset;
}

/* Connection lists container */
#connection-lists {
    margin-left: 0;
    margin-right: 0;
    margin-top: 16px;
    height: 100%;
    overflow-y: auto;
    font-size:14px;
    color: #FFFFFF;
    padding-right: 5px;
}

/* Scrollbars */
#connection-lists {
    height: 78%;
    overflow-y: auto;
    scrollbar-width: thin; 
    scrollbar-color: #555 #222; /* thumb / track */
}
#connection-lists::-webkit-scrollbar { width: 10px; }
#connection-lists::-webkit-scrollbar-track { background: #222; }
#connection-lists::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
#connection-lists::-webkit-scrollbar-thumb:hover { background: #777; }

/* Connection items */
.connection-item {
    margin-bottom:4px;
    padding: 2px 4px;
    color: #CCCCCC;
    border-radius: 3px;
    transition: background 0.2s;
    padding-left: 5%;
}
.connection-item:hover {
    background-color: #444;
    cursor: pointer;
}

#profile-viewer {
  margin-top: 16px;
  height: 78%;
  overflow-y: auto;
  font-size: 14px;
  color: white;
  padding-right: 5px;
}

    #skin-viewer *{ background-image: "image-preview"; }

/* Network container */
#network {
    width:80%; height:100%;  margin-left: 20%;
}

/* Status bar */
#status-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; 
    background: #333333; color: #FFFFFF;
    font-family: monospace; font-size: 14px; 
    display: flex; justify-content: space-between;
    align-items: center; padding: 6px 12px; z-index: 20;
}

/* Headline styles */
.headline{
    font-size:16px; 
    margin-bottom: 8px;
    color: #569CD6;
    padding-left: 5%;
}

.hidden { display: none; }
</style>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<link rel="stylesheet" href="https://raw.githack.com/xTimfie/Skin-Editor/main/code/css/minecraft-skinviewer.css">

</head>
<body>

<div id="loading-overlay">
  <div id="loading-text">loading...</div>
</div>

<div id="left-panel">

  <div id="top-buttons">
    <button class="top-btn">1</button>
    <button class="top-btn" id="toggle-gray">→</button>
    <button class="top-btn" id="toggle-weight">I</button>
    <button class="top-btn">4</button>
    <button class="top-btn">5</button>
  </div>

  <input id="search" placeholder="Search player..." />
  <div id="connection-lists" class="hidden">
    <div id="mutual-section" class="headline"><h1>Mutual Connections:</h1></div>
    <div id="nonmutual-section" class="headline" style="margin-top:6px;"><h1>Non-Mutual Connections:</h1></div>
  </div>


</div>



<div id="network"></div>

<!-- Status bar with Show all players toggle -->
<div id="status-bar">
  <div id="status-text">Players: 0 | Connections: 0</div>
  <label style="display:flex; align-items:center; cursor:pointer; margin-right:18px;">
    <input type="checkbox" id="show-all-players" style="margin-right:6px;" /> Show all players
  </label>
</div>

<script>
fetch("./graph_optimized.json")
.then(r => r.json())
.then(data => {

  const overlay = document.getElementById("loading-overlay");
  const statusText = document.getElementById("status-text");
  const showAllCheckbox = document.getElementById("show-all-players");

  // Check URL for all nodes
const urlParams = new URLSearchParams(window.location.search);
let showAll = urlParams.get("all") === "1";
showAllCheckbox.checked = showAll; // <-- only set to true if URL has all=1



  // Toggle reload to show all or only connected nodes
  showAllCheckbox.addEventListener("change", () => {
    const newUrl = new URL(window.location.href);
    if (showAllCheckbox.checked) {
      newUrl.searchParams.set("all", "1");
    } else {
      newUrl.searchParams.delete("all");
    }
    window.location.href = newUrl.toString();
  });

  // 1. Build nodes map
  const nodesMap = new Map();
  data.nodes.forEach(n => { if (n.uuid) nodesMap.set(n.uuid, { id: n.uuid, label: n.username || n.uuid }); });

  // 2. Build raw edges
  const rawEdges = [];
  data.edges.forEach(e => { if (e.from_user_id && e.to_user_id) rawEdges.push({ from: e.from_user_id, to: e.to_user_id, weight: Number(e.total_mentions || 1) }); });

  // 3. Merge mutual edges
  const edgeMap = new Map();
  rawEdges.forEach(e => {
    const key = [e.from, e.to].sort().join("|");
    if (!edgeMap.has(key)) edgeMap.set(key, { s: e.from < e.to ? e.from : e.to, t: e.from < e.to ? e.to : e.from, w1:0, w2:0 });
    const entry = edgeMap.get(key);
    if (e.from === entry.s) entry.w1 += e.weight; else entry.w2 += e.weight;
  });

  // 4. Build mergedEdges and connected node IDs
  const mergedEdges = [];
  const connectedIds = new Set();
  edgeMap.forEach(e => {
    if (e.w1 + e.w2 > 0) {
      mergedEdges.push({ s:e.s, t:e.t, w1:e.w1, w2:e.w2, w:e.w1+e.w2, mutual:e.w1>0 && e.w2>0 });
      connectedIds.add(e.s); connectedIds.add(e.t);
    }
  });

  // 5. Filter nodes based on showAll
  const nodes = showAll ? [...nodesMap.values()] : [...nodesMap.values()].filter(n => connectedIds.has(n.id));

  // 6. Compute node degrees
  const nodeDegrees = {};
  mergedEdges.forEach(e => { nodeDegrees[e.s]=(nodeDegrees[e.s]||0)+1; nodeDegrees[e.t]=(nodeDegrees[e.t]||0)+1; });

  const placeholderImage = new Image();
  placeholderImage.src = "https://mc-heads.net/avatar/null";


  // 7. Vis.js DataSets
  const visNodes = new vis.DataSet(nodes.map(n => ({
    id: n.id,
    label: n.label,
    shape: 'circularImage',
    image: placeholderImage.src,
    font: { face: 'Minecraftia', size: 14, align: 'bottom', color: "#FFFFFF" },
    value: 10
  })));

  function interpolateColor(fraction, minColor, maxColor) {
    fraction = Math.max(0, Math.min(1, fraction));
    const r = Math.round(minColor[0] + fraction * (maxColor[0]-minColor[0]));
    const g = Math.round(minColor[1] + fraction * (maxColor[1]-minColor[1]));
    const b = Math.round(minColor[2] + fraction * (maxColor[2]-minColor[2]));
    return `rgb(${r},${g},${b})`;
  }

  const EDGE_COLOR_CONFIG = { minColor: [102,178,255], maxColor: [255,165,0], maxMentions: 100 };

  const visEdges = new vis.DataSet(mergedEdges.map(e => {
    const degreeSum = (nodeDegrees[e.s]||1)+(nodeDegrees[e.t]||1);
    let color = e.mutual ? interpolateColor(Math.min(1, Math.sqrt((e.w1*e.w2)/(EDGE_COLOR_CONFIG.maxMentions**2))), EDGE_COLOR_CONFIG.minColor, EDGE_COLOR_CONFIG.maxColor) : "rgb(192,192,192)";
    return { id:`${e.s}-${e.t}`, from:e.s, to:e.t, width:1, color, w1:e.w1, w2:e.w2, mutual:e.mutual, length:150+degreeSum*15 };
  }));

  // 8. Create network
  const network = new vis.Network(document.getElementById('network'), { nodes:visNodes, edges:visEdges }, {
    nodes:{shape:'dot', scaling:{min:5,max:25}},
    edges:{smooth:{type:'continuous'}},
    physics:{enabled:true, stabilization:{iterations:2000}, barnesHut:{gravitationalConstant:-9000000, centralGravity:0.05, springLength:420, springConstant:0.08, damping:0.75, avoidOverlap:1.5}},
    interaction:{selectConnectedEdges:false}
  });

  // 1️⃣ Disable physics after initial stabilization
network.once("stabilizationIterationsDone", () => {
    network.setOptions({ physics: false });
    console.log("Initial stabilization complete, physics disabled.");
});

// 2️⃣ Enable physics while dragging a node
network.on("dragStart", params => {
    if (params.nodes.length) {
        network.setOptions({ physics: true });
        console.log("Node drag started, physics enabled.");
    }
});

// 3️⃣ Disable physics again after drag ends and network stabilizes
network.on("dragEnd", async params => {
    if (params.nodes.length) {
        // Give vis-network a tick to stabilize after drag
        await new Promise(res => setTimeout(res, 100)); // 100ms is usually enough
        network.setOptions({ physics: false });
        console.log("Node drag ended, physics disabled again.");
    }
});

  // Hide loading overlay after first draw
  network.once("afterDrawing", async () => {
        overlay.style.transition="opacity 0.5s"; 
        overlay.style.opacity=0;
        setTimeout(()=>overlay.style.display='none',500);

        // async replacement of images
        for (const n of nodes) {
            visNodes.update({ id: n.id, image: `https://mc-heads.net/avatar/${n.label}` });
            await new Promise(res => setTimeout(res, 50)); // optional progressive effect
        }
    });

  // 9. UI logic
  const searchInput = document.getElementById('search');
  const mutualDiv = document.getElementById("mutual-section");
  const nonMutualDiv = document.getElementById("nonmutual-section");
  const connectionLists = document.getElementById("connection-lists");
  const toggleGrayBtn = document.getElementById("toggle-gray");
  const toggleMinWeight = document.getElementById("toggle-weight");
  let grayVisible = true;

  let currentNode = null;

  const index = {};
  nodes.forEach(n=>index[n.label.toLowerCase()]=n.id);

  function renderSection(div, title, edges, nodeId){
    if(!edges.length){ div.innerHTML=`<b>${title}</b><br><i>No connections</i>`; return; }
    const list = edges.map(e=>{ const other=e.from===nodeId?e.to:e.from; return { label: visNodes.get(other).label, weight:e.w1+e.w2 }; })
                     .sort((a,b)=>b.weight-a.weight);
    div.innerHTML=`<b>${title}</b><br>`+list.map(c=>`<div class="connection-item">${c.label}</div>`).join("");
  }

  function showConnections(nodeId){
    connectionLists.classList.remove("hidden");
    const edges = visEdges.get({ filter: e => e.from===nodeId || e.to===nodeId });
    renderSection(mutualDiv,"Mutual Connections:", edges.filter(e=>e.mutual), nodeId);
    if(grayVisible){ nonMutualDiv.classList.remove("hidden"); renderSection(nonMutualDiv,"Non-Mutual Connections:", edges.filter(e=>!e.mutual), nodeId);}
    else nonMutualDiv.classList.add("hidden");
  }


  searchInput.addEventListener('input',()=>{ const id=index[searchInput.value.trim().toLowerCase()]; if(id){currentNode=id; showConnections(id); network.focus(id,{scale:3,animation:{duration:500,easingFunction:'easeInOutQuad'}}); } });

  network.on("selectNode", params => { currentNode=params.nodes[0]; searchInput.value=visNodes.get(currentNode).label; showConnections(currentNode);});
  network.on("deselectNode", ()=>{ currentNode=null; connectionLists.classList.add("hidden"); });

  toggleGrayBtn.addEventListener("click", () => {
    grayVisible = !grayVisible;

    // Update edges
    const edgeUpdates = visEdges.get().map(e => {
        if (!e.mutual) return { id: e.id, hidden: !grayVisible, physics: grayVisible };
        return null;
    }).filter(Boolean);
    visEdges.update(edgeUpdates);

    // Update nodes
    const nodeUpdates = visNodes.get().map(node => {
        // Get edges connected to this node
        const connectedEdges = visEdges.get({ filter: e => e.from === node.id || e.to === node.id });
        // Show node if it has any mutual edge OR if gray edges are visible
        const hasVisibleEdge = connectedEdges.some(e => e.mutual || (grayVisible && !e.mutual));
        return { id: node.id, hidden: !hasVisibleEdge };
    });
    visNodes.update(nodeUpdates);

    // Update button text
    toggleGrayBtn.textContent = grayVisible ? "→" : "⇋";

    network.stabilize(400);

    // Re-show connections if a node is selected
    if (currentNode) showConnections(currentNode);
    
    updateStatus();
});

const minConnectionWeights = [1, 3, 5, 10, 25];
let currentWeightModeIndex = 0; // starts at 0 → weight 1

toggleMinWeight.addEventListener("click", () => {
    // Cycle to next mode
    currentWeightModeIndex = (currentWeightModeIndex + 1) % minConnectionWeights.length;
    const minWeight = minConnectionWeights[currentWeightModeIndex];

    // Switch-case to set symbol on the button
    let symbol;
    switch(currentWeightModeIndex) {
        case 0: symbol = "I"; break;
        case 1: symbol = "III"; break;
        case 2: symbol = "V"; break;
        case 3: symbol = "X"; break;
        case 4: symbol = "XXV"; break;
        default: symbol = "I";
    }
    toggleMinWeight.textContent = symbol; // update button display

    // Update edges based on mode + gray visibility
    const edgeUpdates = visEdges.get().map(e => {
        const weight = e.w1 + e.w2;
        const showEdge = (e.mutual || (grayVisible && !e.mutual)) && weight >= minWeight;
        return { id: e.id, hidden: !showEdge, physics: showEdge };
    });
    visEdges.update(edgeUpdates);

    // Update nodes visibility
    const nodeUpdates = visNodes.get().map(node => {
        const connectedEdges = visEdges.get({ filter: e => e.from === node.id || e.to === node.id });
        const hasVisibleEdge = connectedEdges.some(e => !e.hidden);
        return { id: node.id, hidden: !hasVisibleEdge };
    });
    visNodes.update(nodeUpdates);

    network.stabilize(400);

    if (currentNode) showConnections(currentNode);
    updateStatus();

    console.log("Mode set to:", minWeight);
});




  function updateStatus(){
    const visibleNodes = visNodes.get().length;
    const visibleEdges = visEdges.get({filter:e=>!e.hidden}).length;
    statusText.textContent=`Players: ${visibleNodes} | Connections: ${visibleEdges}`;
  }
  // Initial status update
  updateStatus();
});
</script>

</body>
</html>
