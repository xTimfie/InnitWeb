name: Generate Lookalikes

on:
  workflow_run:
    workflows: ["Fetch Skins"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  lookalikes:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure latest main
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install pillow numpy

      - name: Generate lookalikes
        run: python tools/generate_lookalikes.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/lookalikes.json; then
            echo "No lookalikes changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/lookalikes.json
          git commit -m "Update data/lookalikes.json"
          git push
