name: Fetch Skins

on:
  workflow_run:
    workflows: ["Optimize Graph"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure latest main
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install requests pillow numpy

      - name: Fetch skins
        run: python tools/fetch_skins.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/skins; then
            echo "No skin changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/skins
          git commit -m "Update data/skins"
          git push
